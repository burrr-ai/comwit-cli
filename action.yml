name: Setup comwit
description: Install the comwit CLI and add it to PATH.
branding:
  icon: terminal
  color: purple

inputs:
  version:
    description: comwit release tag to install, for example v0.1.6. Defaults to the latest release.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install comwit
      shell: bash
      env:
        COMWIT_VERSION: ${{ inputs.version }}
      run: |
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "/usr/local/bin" >> "$GITHUB_PATH"
