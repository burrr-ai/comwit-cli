name: Windows Git access

# Git for Windows enables Git Credential Manager in its system config, so this
# exercises the real helper chain that agent-run logins hit there. Kept out of
# ci.yml, whose release contract allows one test pass.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows Git access
    if: github.event.pull_request.state == 'open'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -run "TestGitAccess|TestGitCredential|TestLogin" ./cmd/comwit
